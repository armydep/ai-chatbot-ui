server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: all paths serve index.html, React Router handles the rest
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend (avoids CORS in production)
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Proxy health endpoints
    location /health {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
